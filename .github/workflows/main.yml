name: openmptcprouter
on: [push]

permissions:
  contents: read

env:
  REPO_URL: 'https://github.com/ysurac/openmptcprouter'

jobs:
  build:
    strategy:
      matrix:
        OMR_TARGET: [bpi-r1, bpi-r2, bpi-r3, bpi-r4, bpi-r4-pro-8x, bpi-r4-poe, bpi-r64, rpi2, rpi4, wrt32x, espressobin, r2s, rpi3, wrt3200acm, x86, x86_64, ubnt-erx, r4s, r7800, rutx12, rutx50, r5s, qnap-301w, rpi5, z8102ax_128m, z8102ax_64m, z8102ax-emmc, gl-mt6000, gl-mt3000, gl-mt2500, r5c, z8109ax_128m, z8802be_128m, z8803be, gl-mt5000, r3s, gl-mt2500-airoha, gl-x3000, gl-xe3000, cznic_turris-omnia, gl-mt3600be]
        OMR_KERNEL: ["6.18"]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Branch name
      id: branch_name
      run: |
        echo "SOURCE_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
        echo "SOURCE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "WORKSPACE=${GITHUB_WORKSPACE}" >> $GITHUB_OUTPUT
    - name: Prepare
      run: |
        sudo apt-get update
        sudo apt-get install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler python3-pyelftools llvm clang python3-docutils
    - name: Install LLVM
      run: |
        sudo apt-get install llvm clang
    - name: Free disk space
      run: |
        df -h
        sudo swapoff -a >/dev/null 2>&1 || true
        sudo rm -f /swapfile >/dev/null 2>&1 || true
        sudo apt-get autoremove -y >/dev/null 2>&1 || true
        sudo apt-get autoclean -y >/dev/null 2>&1 || true
        sudo rm -rf "/usr/local/share/boost" >/dev/null 2>&1 || true
        sudo rm -rf "$AGENT_TOOLSDIRECTORY" >/dev/null 2>&1 || true
        sudo rm -rf /usr/share/dotnet >/dev/null 2>&1 || true
        sudo rm -rf /usr/local/lib/android >/dev/null 2>&1 || true
        sudo rm -rf /opt/ghc >/dev/null 2>&1 || true
        sudo docker rmi $(docker images -qf "dangling=true") >/dev/null 2>&1 || true
        df -h
    - name: Clone source code
      working-directory: ../../
      env: 
        REPO_URL: https://github.com/ysurac/openmptcprouter
        SOURCE_NAME: ${{ steps.branch_name.outputs.SOURCE_NAME }}
        GITHUB_WORKSPACE: ${{ steps.branch_name.outputs.WORKSPACE }}
      run: |
        git clone $REPO_URL omr
        if [ "$SOURCE_NAME" != "develop" ]; then
          cd omr
          pwd
          git fetch
          git checkout master
        else
          cd omr
          git checkout develop
        fi
        git pull
        pwd
    - name: Build toolchain
      working-directory: ../../omr
      env:
        # Build the pushed commit of the repository that ran the workflow,
        # not the branch tip of ysurac's feed at clone time.
        OMR_FEED_URL: ${{ github.server_url }}/${{ github.repository }}
        OMR_FEED_SRC: ${{ github.sha }}
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
        OMR_HOST: ${{ secrets.OMR_HOST }}
        OMR_PORT: ${{ secrets.OMR_PORT }}
      run: |
        OMR_KERNEL="${OMR_KERNEL}" OMR_FEED_SRC="${OMR_FEED_SRC}" sh build.sh prepare {tools,toolchain}/install -j$(nproc) || OMR_KERNEL="${OMR_KERNEL}" OMR_FEED_SRC="${OMR_FEED_SRC}" sh build.sh prepare {tools,toolchain}/install -j1 V=s
    - name: Install the apk keys
      working-directory: ../../omr
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
        OMR_APK_PRIVKEY: ${{ secrets.OMR_APK_PRIVKEY }}
      run: |
        # Images must trust the OMR key, so its public half is the
        # public-key.pem that base-files ships. The private half never
        # enters the buildroot, where every package build could read it:
        # packages and indexes are signed with a throwaway key, trusted at
        # image install time through build-public-key.pem (apk loads every
        # file of its keys dir), then re-signed after the build. Without the
        # secret (forks) the buildroot generates its own pair as before.
        [ -n "$OMR_APK_PRIVKEY" ] || exit 0
        TOPDIR="$OMR_TARGET/$OMR_KERNEL/source"
        ( umask 077; openssl ecparam -name prime256v1 -genkey -noout -out "$TOPDIR/private-key.pem" )
        openssl ec -in "$TOPDIR/private-key.pem" -pubout -out "$TOPDIR/build-public-key.pem"
        printf '%s\n' "$OMR_APK_PRIVKEY" | openssl ec -pubout -out "$TOPDIR/public-key.pem"
        # package/Makefile regenerates public-key.pem from private-key.pem
        # when it is not the newer of the two
        touch "$TOPDIR/public-key.pem"
    - name: Build packages
      working-directory: ../../omr
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
      run: |
        make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source package/{compile,install,index} -j$(nproc) || make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source package/{compile,install,index} -j1 V=s
    - name: Build image
      working-directory: ../../omr
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
      run: |
        make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source target/install -j$(nproc) || make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source target/install -j1 V=s
    - name: Sign packages with the OMR key
      working-directory: ../../omr
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
        OMR_APK_PRIVKEY: ${{ secrets.OMR_APK_PRIVKEY }}
      run: |
        [ -n "$OMR_APK_PRIVKEY" ] || exit 0
        TOPDIR="$PWD/$OMR_TARGET/$OMR_KERNEL/source"
        APK="$TOPDIR/staging_dir/host/bin/apk"
        KEYDIR="$(mktemp -d "$RUNNER_TEMP/apkkey.XXXXXX")"
        trap 'rm -rf "$KEYDIR"' EXIT
        ( umask 077; printf '%s\n' "$OMR_APK_PRIVKEY" > "$KEYDIR/omr.pem" )
        # Check against the key the images ship, not the secret itself
        mkdir "$KEYDIR/trust"
        cp "$TOPDIR/public-key.pem" "$KEYDIR/trust/"
        cd "$TOPDIR/bin"
        # One file per call: apk 3.0.5 adbsign only signs the first file of
        # a list and leaves the others without any signature
        find . -name '*.apk' -type f -print0 | xargs -0 -r -n1 "$APK" adbsign --allow-untrusted --reset-signatures --sign-key "$KEYDIR/omr.pem"
        # Rebuild the indexes instead of re-signing them: the new signature
        # can change a package's size, which the index records
        find . -name packages.adb -type f | while IFS= read -r idx; do
          ( cd "${idx%/packages.adb}" && "$APK" mkndx --root "$TOPDIR" --keys-dir "$KEYDIR/trust" --allow-untrusted --sign "$KEYDIR/omr.pem" --output packages.adb *.apk )
        done
        # adbsign exits 0 on errors: fail here if anything is not signed
        if ! find . \( -name '*.apk' -o -name packages.adb \) -type f -print0 | xargs -0 -r "$APK" verify --keys-dir "$KEYDIR/trust" > "$KEYDIR/verify.log" 2>&1; then
          grep -v ': OK$' "$KEYDIR/verify.log"
          exit 1
        fi
        find . -name sha256sums -type f | while IFS= read -r sums; do
          d="${sums%/sha256sums}"
          while IFS= read -r line; do
            f="${line#* \*}"
            case "$f" in
            *.apk|packages.adb|*/packages.adb)
              printf '%s *%s\n' "$(sha256sum < "$d/$f" | cut -d' ' -f1)" "$f" ;;
            *)
              printf '%s\n' "$line" ;;
            esac
          done < "$sums" > "$sums.new"
          mv "$sums.new" "$sums"
        done
    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ matrix.OMR_TARGET }}
        path: /home/runner/work/omr/${{ matrix.OMR_TARGET }}/${{ matrix.OMR_KERNEL }}/source/bin
        overwrite: true
    - if: startsWith(github.ref, 'refs/tags/')
      name: Deploy - Create directory
      uses: ysurac/ssh-action@5a841de87115730aff750ac127773e3b2b3f56dd # master as of 2026-10-12
      env:
          SOURCE_NAME: ${{ steps.branch_name.outputs.SOURCE_NAME }}
          SOURCE_BRANCH: ${{ steps.branch_name.outputs.SOURCE_BRANCH }}
          SOURCE_TAG: ${{ steps.branch_name.outputs.SOURCE_TAG }}
      with:
        command: |
          mkdir -p deploy/release/${{env.SOURCE_TAG}}/${{matrix.OMR_TARGET}}
        host: ${{ secrets.OMR_DEPLOY_HOST }}
        user: deploy
        port: ${{ secrets.OMR_DEPLOY_PORT }}
        key: ${{ secrets.PRIVATE_KEY }}
        args: -tt
    - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      name: Deploy - Create directory
      uses: ysurac/ssh-action@5a841de87115730aff750ac127773e3b2b3f56dd # master as of 2026-10-12
      env:
          SOURCE_NAME: ${{ steps.branch_name.outputs.SOURCE_NAME }}
          SOURCE_BRANCH: ${{ steps.branch_name.outputs.SOURCE_BRANCH }}
          SOURCE_TAG: ${{ steps.branch_name.outputs.SOURCE_TAG }}
      with:
        command: |
          mkdir -p deploy/${{env.SOURCE_BRANCH}}/${{matrix.OMR_KERNEL}}/${{matrix.OMR_TARGET}}
        host: ${{ secrets.OMR_DEPLOY_HOST }}
        user: deploy
        port: ${{ secrets.OMR_DEPLOY_PORT }}
        key: ${{ secrets.PRIVATE_KEY }}
        args: -tt
    - name: Move binaries for rsync
      working-directory: ../../omr
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
        GITHUB_WORKSPACE: ${{ steps.branch_name.outputs.WORKSPACE }}
      run: |
        mv ${OMR_TARGET}/${OMR_KERNEL}/source/bin ${GITHUB_WORKSPACE}/
    - if: startsWith(github.ref, 'refs/tags/')
      name: Deploy - Upload via rsync
      uses: ysurac/action-rsync@1032c2593f9067e6ce901a1d77c6342dc50bcd24 # master as of 2026-10-12
      env:
        ARGS: -av --delete-after
        TARGET: deploy/release/${{steps.branch_name.outputs.SOURCE_TAG}}/${{matrix.OMR_TARGET}}
        SOURCE: ./bin/
        KEY: ${{ secrets.PRIVATE_KEY }}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}
        SOURCE_NAME: ${{ steps.branch_name.outputs.SOURCE_NAME }}
        SOURCE_BRANCH: ${{ steps.branch_name.outputs.SOURCE_BRANCH }}
        SOURCE_TAG: ${{ steps.branch_name.outputs.SOURCE_TAG }}
        GITHUB_WORKSPACE: ${{ steps.branch_name.outputs.WORKSPACE }}
    - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      name: Deploy - Upload via rsync
      uses: ysurac/action-rsync@1032c2593f9067e6ce901a1d77c6342dc50bcd24 # master as of 2026-10-12
      env:
        ARGS: -av --delete-after
        TARGET: deploy/${{ steps.branch_name.outputs.SOURCE_BRANCH }}/${{matrix.OMR_KERNEL}}/${{matrix.OMR_TARGET}}
        SOURCE: ./bin/
        KEY: ${{ secrets.PRIVATE_KEY }}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}
        SOURCE_NAME: ${{ steps.branch_name.outputs.SOURCE_NAME }}
        SOURCE_BRANCH: ${{ steps.branch_name.outputs.SOURCE_BRANCH }}
        SOURCE_TAG: ${{ steps.branch_name.outputs.SOURCE_TAG }}
        GITHUB_WORKSPACE: ${{ steps.branch_name.outputs.WORKSPACE }}

