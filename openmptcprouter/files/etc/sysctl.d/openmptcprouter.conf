# local sysctl settings can be stored in this directory
# max open files
fs.file-max = 1024000
fs.nr_open = 1024000

# max read buffer
net.core.rmem_max = 134217728
# max write buffer
net.core.wmem_max = 134217728
#net.core.optmem_max = 67108864
# default read buffer
#net.core.rmem_default = 33554432
# default write buffer
#net.core.wmem_default = 33554432
# max processor input queue
net.core.netdev_max_backlog = 16384
# max backlog
net.core.somaxconn = 16384
# Increased packet processing budget
net.core.netdev_budget = 600
# Time for packet processing.
# The kernel refuses (EINVAL) any value below 2 * 1000000 / CONFIG_HZ, which
# is 20000 on the HZ=100 kernels used here. Never lower this value: busybox
# sysctl stops at the first write error, so a rejected key silently discards
# every setting below it in this file.
net.core.netdev_budget_usecs = 20000

# resist SYN flood attacks
net.ipv4.tcp_syncookies = 1
# reuse timewait sockets when safe
net.ipv4.tcp_tw_reuse = 1
# turn off fast timewait sockets recycling
#net.ipv4.tcp_tw_recycle = 0
# short FIN timeout
#net.ipv4.tcp_fin_timeout = 30
# increase max orphans
net.ipv4.tcp_max_orphans = 32768
# short keepalive time
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_keepalive_intvl = 30

# Local (ephemeral) port range for the router's own outgoing connections.
#
# Kept wide on purpose, for the most source ports per destination. The range
# covers ports the router's own services listen on (the proxy's 1100/1101/1111,
# unbound 5353, smartdns 5355, VXLAN, ttyd 7681, the mqvpn control API 9091,
# node-exporter 9101, usteerd 16720...), so an outgoing connection or bind(0)
# could otherwise be handed one of them and the service would fail with
# EADDRINUSE on its next (re)start. /bin/omr-reserved-ports reads those ports
# from UCI and lists them in net.ipv4.ip_local_reserved_ports, which automatic
# assignment skips. Do not set that sysctl here: writing it replaces the whole
# list.
#
# The top stays below the tunnels that bind 65001 and up on the router
# (mlvpn 65202+, ubond 65252+, the OpenVPN client's 65301).
net.ipv4.ip_local_port_range = 1024 65000

# max SYN backlog
net.ipv4.tcp_max_syn_backlog = 8192
# max timewait sockets held by system simultaneously
net.ipv4.tcp_max_tw_buckets = 32768
# turn on TCP Fast Open on both client and server side
#net.ipv4.tcp_fastopen = 3
# TCP receive / write buffers (min default max, bytes).
#
# The 128 MB max is what one connection needs for ~10 Gbit/s up to ~50 ms RTT
# (the sender needs ~2 x rate x RTT). /bin/omr-net-mem keeps it wherever the
# RAM allows - any box with ~1 GB - and lowers it on smaller ones so no single
# socket can exceed the tcp_mem pressure threshold (~10 MB on a 128 MB router,
# still ~2 Gbit/s at 20 ms). An MPTCP connection has one receive window for all
# its subflows, so it holds at most one tcp_rmem max when receiving (measured).
# Values set here are only ever lowered, never raised; turn the cap off with:
# uci set openmptcprouter.settings.tcp_socket_buffers='0'
net.ipv4.tcp_rmem = 4096 1048576 134217728
net.ipv4.tcp_wmem = 4096 1048576 134217728
# TCP/UDP global memory pools (page counts, NOT bytes).
#
# Deliberately not set here: these used to be a fixed
#   net.ipv4.tcp_mem = 786432 1048576 26777216
#   net.ipv4.udp_mem = 102400 204800 4194304
# which on a 1 GB router means a TCP pressure threshold of 4 GiB and a hard
# ceiling of 102 GiB (16 GiB for UDP) - both above physical memory, so the
# kernel could never enter memory pressure and never refuse an allocation.
# Socket memory then grew until the OOM killer fired, taking netifd (and with
# it the whole network) down. MPTCP has no pool of its own: every subflow and
# the mptcp-level socket draw on this one (mptcp_prot.sysctl_mem =
# sysctl_tcp_mem).
#
# /bin/omr-net-mem sizes these from the RAM actually present and writes
# /etc/sysctl.d/zz-omr-net-mem.conf, which sorts after this file and is applied
# on every boot by /etc/init.d/sysctl. Run 'omr-net-mem -s' to see the values.
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# Packetization-layer PMTU discovery (RFC 4821), in blackhole-detection mode.
# Ordinary ICMP path MTU discovery is on either way (ip_no_pmtu_disc = 0);
# this is the fallback for when the "fragmentation needed" messages never
# arrive, which LTE/5G, PPPoE and CGNAT paths do filter. 1 = only after a
# retransmission timeout, then shrink the segment size and probe back up, so
# healthy paths pay nothing. It used to be 0: measured on the bench, an MPTCP
# subflow over such a path then never recovered (0 bytes delivered, marked
# stale) and the connection ran on its other WANs only - 85-90 Mbit/s instead
# of 152-155 over two 100 Mbit/s paths. Each subflow probes on its own, so only
# the affected WAN drops to smaller segments. Not 2: that starts every
# connection at tcp_base_mss (1024 bytes), healthy paths included.
net.ipv4.tcp_mtu_probing = 1
# net.ipv4.tcp_adv_win_scale was set to 2 here. It is a no-op since 6.6:
# include/net/netns/ipv4.h marks the field /* obsolete */ and
# tcp_win_from_space() now divides by the per-socket tcp_sk(sk)->scaling_ratio,
# which the kernel measures from real skb overhead. Nothing reads the sysctl.
# (The old comment claimed 1/8; the value 2 meant 1/4 even back when it worked.)
# limits the size of unsent bytes in the write queue
net.ipv4.tcp_notsent_lowat = 16384

# for low-latency network, use cubic instead
# net.ipv4.tcp_congestion_control = balia

# Conntrack table size: deliberately not set here.
#
# It used to be a fixed
#   net.netfilter.nf_conntrack_max = 262144
#   net.netfilter.nf_conntrack_buckets = 65536
# on every router regardless of RAM. The kernel derives its own from memory
# (nf_conntrack_init_start(): htable = RAM/16384, capped at 65536 below 4 GB,
# max = htable), which is 8192 on a 128 MB board and 65536 on a 1 GB one, so
# the fixed value was 4x to 64x too large. At ~288 bytes per entry a full
# 262144-entry table needs ~75 MB, and unlike tcp_mem there is no pressure
# stage to fall back on - the box just runs out. /bin/omr-net-mem sizes it
# from RAM alongside tcp_mem/udp_mem.
#
# Note the timeout below is what makes the table fill: 432000 s is 5 days, and
# it overrides OpenWrt's own 7440 s from 11-nf-conntrack.conf because this file
# sorts later.
net.netfilter.nf_conntrack_tcp_timeout_established = 432000
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 120
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 60
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 120
net.netfilter.nf_conntrack_generic_timeout = 300

net.ipv4.tcp_ecn = 2
#net.ipv4.tcp_sack = 1
#net.ipv4.tcp_dsack = 1
#net.ipv4.tcp_fack = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_window_scaling = 1

net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_moderate_rcvbuf = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_autocorking = 0

net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
# Same for IPv6: OMR builds weighted multi-nexthop IPv6 routes too
# (routesbalancing6 in omr-tracker's common-post-tracking.sh), and without this
# the kernel keeps hashing flows onto a nexthop whose link is down until the
# tracker removes it. Measured on the bench, one of two links down: with 0,
# 100 of 200 flows were sent into the dead link; with 1, none. For IPv6 the
# kernel reads it per device; writing "all" also sets "default" and every
# existing device (addrconf_linkdown_change()).
net.ipv6.conf.all.ignore_routes_with_linkdown = 1
net.ipv6.conf.default.ignore_routes_with_linkdown = 1
net.ipv4.route.gc_timeout = 60
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.fib_multipath_use_neigh = 1
net.ipv4.fib_multipath_hash_policy = 1
# IPv6 counterpart, for OMR's weighted multi-nexthop IPv6 routes. The load
# balancing page (luci-app-load-balancing) applies its chosen policy to both.
net.ipv6.fib_multipath_hash_policy = 1

net.mptcp.blackhole_timeout = 0

net.ipv6.route.gc_timeout = 60

net.core.bpf_jit_enable = 1
net.core.bpf_jit_harden = 0

# Busy polling for lower latency (use with caution - increases CPU usage)
# net.core.busy_poll = 50
# net.core.busy_read = 50

# RPS/RFS for better CPU distribution
# net.core.rps_sock_flow_entries = 32768